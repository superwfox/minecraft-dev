name: Update Minecraft versions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-minecraft-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update stable version families
        run: npm run versions:update

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- src/logic/minecraftVersions.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or refresh pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: codex/update-minecraft-versions
          PR_TITLE: 自动更新 Minecraft 版本列表 | Update Minecraft versions
          PR_BODY: |
            PaperMC Fill v3 检测到新的稳定 Minecraft 版本系列。

            - 自动更新前端版本选择器与模型解析提示的共享数据源
            - 排除仅有 snapshot、pre 或 rc 的未稳定版本系列
            - 数据源：https://fill.papermc.io/v3/projects/paper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add src/logic/minecraftVersions.ts
          git commit \
            -m "自动更新 Minecraft 版本列表 ｜ Update Minecraft versions :" \
            -m $'details | 要点：\n1. 从 PaperMC Fill v3 同步稳定版本系列\n2. 保持版本选择器与模型提示共享同一数据源'
          git push --force-with-lease --set-upstream origin "$UPDATE_BRANCH"

          if gh pr view "$UPDATE_BRANCH" --json url --jq .url; then
            echo "Pull request already exists and has been refreshed."
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
